# options:
# autocheck and update new version of auto-update - Github
#armor-update-interval - Glue technical armor update cycle
#enable-armor-effects - Switch for armor protection
#chat-prefix - prefix to all messages from slime technology
# auto-save-delay-in-minutes - Automatic data save cycle in minutes
# Legacy-ore-washer - Whether to use the old version of the machine
# Legacy-dust-washer - Whether to use the old version of the scrubber mechanism
# Legacy-ore-grinder - Whether to use the old version of the shredder mechanism
#language - slime text language (excluding articles)
#enable-translations - multilingual
# backwards-compatibility - object back-to-back compatible mode, when closed items will use a new version of the object system
# Will improve performance
#log-duplicate-block-entries - Whether to output warning of the discovery of repeat blocks
#burn-players- when-radioactive - whether to burn players when they are exposed to radiation
# Drop-excess-sf-give-items - whether to use an order to give Slimefun items a direct spill when the backpack is full
# Backup-data - Autoback Data
# bypass-environment-check - Skip compatibility check (note): Question feedback will not be accepted after opening)
options:
  auto-update: true
  chat-prefix: '&a&lSlimefun 4 &7> '
  armor-update-interval: 10
  enable-armor-effects: true
  enable-radiation: true
  radiation-update-interval: 1
  radiation-grace-period: 15
  rainbow-armor-update-interval: 3
  auto-save-delay-in-minutes: 10
  legacy-ore-washer: false
  legacy-dust-washer: false
  legacy-ore-grinder: true
  language: zh-CN
  enable-translations: true
  log-duplicate-block-entries: true
  burn-players-when-radioactive: true
  drop-excess-sf-give-items: false
  backup-data: true
  drop-block-creative: true
  bypass-environment-check: false
  bypass-item-length-check: false

guide:
# Whether to display the original articles composite formula in the guide
  show-vanilla-recipes: true
# Whether or not to automatically give a sticky science guide to players when they first enter the server
  receive-on-first-join: true
# Whether hidden items are shown in the search
  show-hidden-item-groups-in-search: false

researches:
# Whether to allow the creation mode player to unlock for free
  free-in-creative-mode: true
# Whether to light fireworks when unlocking
  enable-fireworks: true
# Whether to use a game currency instead of using an experience unlock
  use-money-unlock: false
# Experience automatically converts to game currency multiplier
  currency-cost-convert-rate: 25.0
# Whether to disable the animation of the unlocking study
  disable-learning-animation: false

URID:
  info-delay: 3000
  custom-ticker-delay: 10
  enable-tickers: true

networks:
  max-size: 200
  cargo-ticker-delay: 0
  enable-visualizer: true
  delete-excess-items: false

talismans:
  use-actionbar: true

metrics:
  auto-update: false

backpack:
# Whether the backpack owner is allowed to be opened when offline
  allow-open-when-owner-offline: true

research-ranks:
- Chicken.
- Cow-cow.
- Spider.
- Villagers.
- Pathfinder.
- A child.
- Intern.
- Unqualified.
- Students.
- Clumsy apprentice.
- Apprenticeship.
- Skilled apprentice.
- A Master's apprentice.
- A great wizard.
- Young magician.
- Clumsy magician.
- Normal magician.
- Magician.
- Skilled magician.
- A magician.
- A magician.
- A great magician.
- Clumsy wizard.
- Wizard.
- A normal wizard.
- A magician.
- A great wizard.
- A great wizard.
- Young master.
- Clumsy master.
- Intern master.
- Maestro.
- Master.
- Maestro.
- A great master.
