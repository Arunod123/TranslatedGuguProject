#########################################################################
# Database type, optional SQLITE, MySQL, POSTGRESQL
# Pay attention: We do not automatically help you to migrate data when switching database types:)
# Pay attention: Set allow-open-when-owner-offline in config.yml to false
# To prevent players from opening the same backpacking items on different servers.
storageType: SQLITE

# Use Base64 coded data fields
base64EncodeVal: true
#########################################################################

#########################################################################
# Number of lines to read and write in database
# When using MYSQL, it is suggested that the maximum number of connections = read + write lines, and that the number of reading lines should be greater than the number of writing lines.
# Pay attention: The number of threads is not as many as possible, but too much leads to a decline in performance.

# Read threads
readExecutorThread: 7
# Writing threads
writeExecutorThread: 3
#########################################################################

#########################################################################
#Sqlite configuration
sqlite:
  maxConnection: 5
#########################################################################

#########################################################################
# MySQL Configuration
mysql:
# Database connection address
  host: "127.0.0.1"
# Database connection port
  port: 3306
# Database name
  database: ""
# Table prefix
  tablePrefix: ""
# Connect to username
  user: ""
# Connect to user password
  password: ""
# Whether to connect with encryption
  useSSL: false
# Maximum number of connections
  maxConnection: 10
#########################################################################

#########################################################################
# PostgreSQL Configuration
postgresql:
# Database connection address
  host: "127.0.0.1"
# Database connection port
  port: 3306
# Database name
  database: ""
# Table prefix
  tablePrefix: ""
# Connect to username
  user: ""
# Connect to user password
  password: ""
# Whether to connect with encryption
  useSSL: false
# Maximum number of connections
  maxConnection: 10
#########################################################################