#########################################################################
# Database type, optional SQLITE, MySQL, POSTGRESQL
# Pay attention: We do not automatically help you to migrate data when switching database types:)
storageType: SQLITE

# Use Base64 coded data fields
base64EncodeVal: true

# Block Data Load Mode
# There's a choice: 
# - LOAD_WITH_CHUNK: Load slime block data when blocks are first loaded during this start-up period
# - LOAD_ON_STARTUP: A one-time loading of all block data at the start of the service may result in a longer start time
# The use of LOAD_WITH_CHUNK is recommended by default to save unnecessary memory costs
# Change to LOAD_ON_STARTUP if significant Caden occurs when load blocks are found
dataLoadMode: LOAD_WITH_CHUNK
#########################################################################

#########################################################################
# Number of lines to read and write in database
# When using MySQL, it is suggested that the maximum number of connections be set to read + write lines and that the number of reading lines should be greater than the number of writing lines.
# Pay attention: The number of threads is not as many as possible, but too much leads to a decline in performance.

# Read threads
readExecutorThread: 15
# Writing threads
writeExecutorThread: 5
#########################################################################

#########################################################################
# Delay writing
# This function is used to prevent some data from being frequently written, leading to a large number of meaningless writing requests in the queue.
# When this function is enabled, data changes will be followed by (delayedSecond) seconds, if no other changes are made before writing to the database.
# When you are forced to save, you can add the data that you are waiting for directly to the queue.
delayedWriting:
# Whether to enable delayed writing
  enable: true
# Delayed writing in seconds
  delayedSecond: 5
# Force to save interval (sec)
  forceSavePeriod: 300
#########################################################################

#########################################################################
#Sqlite configuration
sqlite:
  maxConnection: 5
#########################################################################

#########################################################################
# MySQL Configuration
mysql:
# Database connection address
  host: "127.0.0.1"
# Database connection port
  port: 3306
# Database name
  database: ""
# Table prefix
  tablePrefix: ""
# Connect to username
  user: ""
# Connect to user password
  password: ""
# Whether to connect with encryption
  useSSL: false
# Maximum number of connections
  maxConnection: 10
#########################################################################

#########################################################################
# PostgreSQL Configuration
postgresql:
# Database connection address
  host: "127.0.0.1"
# Database connection port
  port: 3306
# Database name
  database: ""
# Table prefix
  tablePrefix: ""
# Connect to username
  user: ""
# Connect to user password
  password: ""
# Whether to connect with encryption
  useSSL: false
# Maximum number of connections
  maxConnection: 10
#########################################################################