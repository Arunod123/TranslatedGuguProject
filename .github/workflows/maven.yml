name: Java CI with Maven

on:
  push:
    branches: [ "codespace-special-palm-tree-wwj44qvqqg7h5j5" ]
  pull_request:
    branches: [ "codespace-special-palm-tree-wwj44qvqqg7h5j5" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B --no-transfer-progress package --file pom.xml

      # NOTE: you can keep the action, but it may fail to upload if dependency graph isn't enabled
      - name: Update dependency graph (may fail if server/repo not enabled)
        uses: advanced-security/maven-dependency-submission-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
