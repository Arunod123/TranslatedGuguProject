name: Java CI with Maven

on:
  push:
    branches: ["codespace-special-palm-tree-wwj44qvqqg7h5j5"]
  pull_request:
    branches: ["codespace-special-palm-tree-wwj44qvqqg7h5j5"]
  workflow_dispatch:

env:
  TZ: 'Asia/Shanghai'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ vars.JAVA_CI_VERSION || 21 }}
          java-package: jdk
          architecture: x64
          cache: maven

      - name: Codestyle Check
        run: mvn -B spotless:check --errors

      - name: Build Project
        run: mvn -B package --errors

      - uses: actions/upload-artifact@v4
        name: Upload Build Artifact
        with:
          name: Java Project Build
          path: target/*.jar

      - name: Automatic Releases
        uses: marvinpinto/action-automatic-releases@v1.2.1
        if: github.ref_name == 'codespace-special-palm-tree-wwj44qvqqg7h5j5'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "exp"
          prerelease: true
          title: "Java Project Automatic Build"
          files: |
            target/*.jar
