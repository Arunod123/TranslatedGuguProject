name: Java CI with Maven

on:
  push:
    branches: ["codespace-special-palm-tree-wwj44qvqqg7h5j5"]
  pull_request:
    branches: ["codespace-special-palm-tree-wwj44qvqqg7h5j5"]
  workflow_dispatch:

env:
  TZ: 'Asia/Shanghai'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk
          architecture: x64
          cache: maven

      - name: Download ItemsAdder API
        run: wget -O itemsadder-api-3.6.1.jar https://example.com/itemsadder-api-3.6.1.jar

      - name: Install ItemsAdder API
        run: mvn install:install-file -Dfile=itemsadder-api-3.6.1.jar \
                                     -DgroupId=com.github.LoneDev6 \
                                     -DartifactId=itemsadder-api \
                                     -Dversion=3.6.1 \
                                     -Dpackaging=jar

      - name: Download VaultAPI
        run: wget -O VaultAPI-1.7.1.jar https://example.com/VaultAPI-1.7.1.jar

      - name: Install VaultAPI
        run: mvn install:install-file -Dfile=VaultAPI-1.7.1.jar \
                                     -DgroupId=com.github.MilkBowl \
                                     -DartifactId=VaultAPI \
                                     -Dversion=1.7.1 \
                                     -Dpackaging=jar

      - name: Codestyle Check
        run: mvn -B spotless:check --errors

      - name: Build with Maven
        run: mvn -B --no-transfer-progress package --file pom.xml

      - uses: actions/upload-artifact@v4
        name: Upload Build Artifact
        with:
          name: Java Project Build
          path: target/*.jar

      - name: Automatic Releases
        uses: marvinpinto/action-automatic-releases@v1.2.1
        if: github.ref_name == 'codespace-special-palm-tree-wwj44qvqqg7h5j5'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "exp"
          prerelease: true
          title: "Java Project Automatic Build"
          files: |
            target/*.jar
